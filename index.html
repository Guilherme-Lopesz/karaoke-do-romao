html{color-scheme:dark;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}

.rail::-webkit-scrollbar{display:none}

.grp{font:600 15px var(--body);color:var(--muted);margin:20px 0 4px}

.row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.row i{font:normal 600 14px var(--body);color:var(--gold);flex:none}
.row small{display:block;color:var(--muted);font-size:14px}
.back{font:inherit;color:var(--gold);background:none;border:0;padding:12px 0;cursor:pointer}
.back:focus-visible{outline:2px solid var(--gold)}
.ban{margin:6px 0 4px;text-align:center;padding:14px 18px;border:2px solid var(--gold-lo);border-radius:6px;background:linear-gradient(180deg,#4a3012,#2b1a0a);box-shadow:inset 0 0 0 3px #1d1107,0 4px 18px rgba(0,0,0,.5)}
.ban h1{margin:0;font:400 30px/1.1 var(--display);background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}

.sh{padding:22px 22px 20px}
.lbl{margin:14px 0 0;color:var(--muted);font-size:14px}
.sh h3{margin:0;font:400 27px/1.15 var(--display);overflow-wrap:anywhere}

.close{display:block;width:100%;margin-top:18px;font:600 17px var(--body);color:#2b1a0a;background:var(--goldgrad);border:0;border-radius:12px;padding:13px;cursor:pointer}

const $=s=>document.querySelector(s), main=$('#main'), dlg=$('#dlg'), rail=$('#rail'), q=$('#q');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=D.map(([n,s],i)=>({n,s,i,k:norm(n)}));
const S=[];A.forEach(a=>a.s.forEach(([t,c])=>S.push({a:a.i,t,c,k:norm(t)})));
let dur={};fetch('duracoes.json').then(r=>r.json()).then(j=>dur=j).catch(()=>{});
const letter=a=>{const c=a.k[0].toUpperCase();return c>='A'&&c<='Z'?c:'#'};

function home(){
  let h='',cur='',ls=[];
  A.forEach(a=>{const L=letter(a);
    if(L!==cur){cur=L;ls.push(L);h+=`<h2 class="l" id="L${L==='#'?'n':L}">${L}</h2>`}
    h+=`<button class="row" data-a="${a.i}"><span>${esc(a.n)}</span><i>${a.s.length} ${a.s.length>1?'músicas':'música'}</i></button>`});
  main.innerHTML=h;
  rail.hidden=false;
  rail.innerHTML=ls.map(L=>`<button data-l="${L==='#'?'n':L}" aria-label="Letra ${L}">${L}</button>`).join('');
}
function artist(i){
  const a=A[i]; if(!a){location.hash='';return}
  rail.hidden=true;
  main.innerHTML=`<button class="back" data-back>‹ Todos os cantores</button>
  <div class="ban"><h1>${esc(a.n)}</h1><p>${a.s.length} ${a.s.length>1?'músicas':'música'}</p></div>`+
  a.s.map(([t,c])=>`<button class="row" data-s="${i}:${c}:${esc(t)}"><span>${esc(t)}</span><i>${c}</i></button>`).join('');
  scrollTo(0,0);
}
function search(v){
  const k=norm(v.trim()); rail.hidden=true;
  const ar=A.filter(a=>a.k.includes(k)).slice(0,25);
  const so=S.filter(s=>s.k.includes(k)||String(s.c)===k).slice(0,80);
  let h='';
  if(ar.length)h+=`<p class="grp">Cantores</p>`+ar.map(a=>`<button class="row" data-a="${a.i}"><span>${esc(a.n)}</span><i>${a.s.length}</i></button>`).join('');
  if(so.length)h+=`<p class="grp">Músicas</p>`+so.map(s=>`<button class="row" data-s="${s.a}:${s.c}:${esc(s.t)}"><span>${esc(s.t)}<small>${esc(A[s.a].n)}</small></span><i>${s.c}</i></button>`).join('');
  main.innerHTML=h||`<p class="empty">Nada encontrado para “${esc(v)}”. Tente outro nome.</p>`;
}
function route(){
  const m=location.hash.match(/^#c(\d+)$/);
  if(q.value.trim().length>1) search(q.value);
  else if(m) artist(+m[1]); else home();
}
function open(a,c,t){
  const d=dur[c];
  $('#sh').innerHTML=`<p class="lbl" style="margin-top:0">Cantor</p><h3>${esc(A[a].n)}</h3>
  <p class="lbl">Música</p><h3>${esc(t)}</h3>
  <p class="lbl">Código</p><button class="code" id="cp" aria-label="Copiar código ${c}">${c}</button>
  <p class="tap" id="tap">Toque no código para copiar</p>
  <p class="lbl">Duração: <b style="color:var(--cream)">${d?esc(d):'não informada'}</b></p>
  <button class="close" id="x">Fechar</button>`;
  dlg.showModal();
  $('#x').onclick=()=>dlg.close();
  $('#cp').onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(String(c));ok=true}catch(e){}
    $('#tap').textContent=ok?'Código copiado!':'Anote o código acima';};
}
main.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.a){q.value='';location.hash='#c'+b.dataset.a;route();scrollTo(0,0)}
  else if(b.dataset.s){const [a,c,...t]=b.dataset.s.split(':');open(+a,c,t.join(':'))}
  else if('back' in b.dataset){location.hash='';route()}
});
rail.addEventListener('click',e=>{const b=e.target.closest('button');if(b)document.getElementById('L'+b.dataset.l).scrollIntoView()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
q.addEventListener('input',route);
addEventListener('hashchange',route);
route();
</script>
